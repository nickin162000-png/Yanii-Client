name: Gerar .jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle') }}

      - name: Baixar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Preparar o Minecraft
        run: ./gradle-2.14.1/bin/gradle setupCiWorkspace --no-daemon

      - name: Converter nomes SRG para MCP
        run: python3 tools/srg2mcp.py ~/.gradle src/main/java

      - name: Compilar
        run: ./gradle-2.14.1/bin/gradle build --no-daemon

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: YaniClient-jar
          path: build/libs/*.jar
